name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  # Run shortly after midnight in both possible Europe/Prague UTC offsets.
  # The build applies the Europe/Prague publication-date check, so the earlier
  # winter run is harmless and the second summer run is a harmless rebuild.
  schedule:
    - cron: "15 22,23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate the static website
        run: npm test

      - name: Verify the custom domain
        run: test "$(cat dist/CNAME)" = "blog.libcna.com"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
